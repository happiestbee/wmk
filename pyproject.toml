[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmk"
version = "0.1.0"
description = "Key-agnostic reference library and capacity atlas for keyed LLM text watermarks (SynthID-Text family)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# C7: EXACT pins only. `transformers` changes tokenizer behaviour, logits-processor
# interfaces and sampling code across minor versions, which breaks byte-identical
# reruns. tests/test_versions.py asserts the installed versions match these pins.
dependencies = [
    "torch==2.9.1",
    "transformers==4.57.6",
    "tokenizers==0.22.1",
    "safetensors==0.6.2",
    "huggingface-hub==0.35.3",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "matplotlib==3.10.6",
    "datasets==4.3.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
# Phase 1.5: c2pa_check.py is standalone and imports nothing from src/wmk.
c2pa = ["c2pa-python==0.7.2"]
dev = ["pytest==8.4.2", "pytest-timeout==2.4.0"]

[project.scripts]
wmk = "wmk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires a model forward pass",
    "network: requires huggingface.co access",
]
